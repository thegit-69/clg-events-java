services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: clg-events-backend
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:8080"
    env_file:
      - ./backend/.env
    environment:
      - PORT=8080
      - CORS_ALLOWED_ORIGINS=http://localhost:5173,http://localhost:3000,http://localhost:80,http://localhost
    networks:
      - clg-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:8080/api/v1
        VITE_WS_BASE_URL: http://localhost:8080/ws-events
    container_name: clg-events-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - clg-network

networks:
  clg-network:
    driver: bridge
