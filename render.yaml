services:
  - type: web
    name: clg-events-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: Dockerfile
    plan: free
    healthCheckPath: /api/v1/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_USERNAME
        sync: false
      - key: DATABASE_PASSWORD
        sync: false
      - key: NEON_AUTH_BASE_URL
        sync: false
      - key: SUPER_ADMIN_EMAIL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
